# Builds the site on every push so content mistakes (a bad CSV, a missing
# image, invalid YAML) show up as a red ✗ on the commit instead of silently
# publishing a broken page. The friendly error from src/lib/content.js
# appears in the failed job's log.
name: Build

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # npm install rather than npm ci: the main branch has no lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
