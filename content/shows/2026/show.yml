statement: >
  At This Moment celebrates painting in all its forms and its long-standing
  role in how people express themselves. The exhibition welcomes work in all
  painting media, as well as collage and mixed-media pieces with a strong
  painted element. Selected work by emerging and established artists living
  or working anywhere in New England is shown in LexArt's Molly Harding Nye
  Gallery, a museum-style exhibition space in the center of Lexington.
