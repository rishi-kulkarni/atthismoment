title: At This Moment
tagline: Painting and Collage in New England
description: >
  A juried exhibition of painting, collage, and mixed media by New England
  artists, presented by the LexArt Painting Studio Group in Lexington,
  Massachusetts.

# `show` picks whose promo graphic the home page uses. It has to match a
# folder name under content/shows/.
#
# To swap the home page over to the 2028 call: change `show` to 2028 and
# rewrite the four fields below it. Nothing else on the site moves.
featured:
  show: 2026
  eyebrow: Opening August 8
  headline: The 2026 exhibition opens this month
  brief: >
    Recent work by painters from across New England, selected by juror
    Deborah Krieger. The exhibition runs August 8–30 at LexArt's Molly
    Harding Nye Gallery in Lexington, with a closing reception on
    Saturday, August 29. An online gallery opens here on August 22.

  # The two or three things a visitor should do now. Not a nav bar.
  links:
